name: craft_hub_app
description: Craft Hub — projects, matchmaking, social feed, chat (Flutter + Node API).
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  socket_io_client: ^3.0.2
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  flutter_local_notifications: ^21.0.0
  google_sign_in: ^7.2.0
  # Direct dependency because the app renders the Google-managed GIS button on web.
  google_sign_in_web: ^1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/applogo.png"
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/images/applogo.png"
  

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.jpg

